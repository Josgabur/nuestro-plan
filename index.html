function calculateTargets({age,weight,height,sex='male',activity='low',objective='fatloss'}){
  age=Number(age);weight=Number(weight);height=Number(height);
  if(!(age>=18&&age<=100&&weight>=25&&weight<=400&&height>=100&&height<=240))throw Error('Ingresa edad, peso y estatura válidos para calcular tus objetivos.');
  // Mifflin-St Jeor; activity reflects usual steps and intended gym training.
  const bmr=10*weight+6.25*height-5*age+(sex==='female'?-161:5);
  const multiplier={low:1.30,light:1.42,moderate:1.55}[activity]||1.30;
  const minimum=sex==='female'?1200:1500;
  const calories=Math.round(Math.max(minimum,bmr*multiplier*(objective==='fatloss'?0.80:1))/50)*50;
  const targetWeight=objective==='fatloss'?weight*.95:weight;
  const protein=Math.round(targetWeight*1.65/5)*5;
  return {calories,protein};
}

function legacyRenderFood(){$('food').innerHTML=`<h2>Nutrición</h2><p class="muted">Cocinan lo mismo; cada persona sirve sus porciones.</p><div class="card"><h3>Cómo organizar tu día</h3><div class="listitem"><strong>Desayuno · 07:00–09:00</strong><p>Proteína + vegetales + porción moderada de carbohidrato con fibra.</p></div><div class="listitem"><strong>Almuerzo · 12:30–14:00</strong><p>En el comedor: 1–2 palmas de proteína magra, medio plato de vegetales y porción pequeña de arroz o menestra. Agua en lugar de jugo azucarado.</p></div><div class="listitem"><strong>Merienda · 16:30–17:30</strong><p>Yogur natural alto en proteína y fruta, o sándwich integral pequeño con pollo.</p></div><div class="listitem"><strong>Cena · 20:00–21:00</strong><p>Proteína magra + verduras + carbohidrato de buena calidad según hambre y entrenamiento.</p></div></div><div class="card"><h3>Registrar tu alimentación</h3><label>Fecha<input id="foodDate" type="date" value="${today()}"></label><label>Comida<select id="meal"><option>Desayuno</option><option>Almuerzo</option><option>Merienda</option><option>Cena</option></select></label><label>Qué comiste<input id="mealDesc" placeholder="Ej.: pollo, ensalada, arroz integral"></label><label>Calorías aproximadas (opcional)<input id="mealCalories" type="number" min="0" placeholder="Opcional"></label><button class="btn" id="saveFood">Guardar comida</button></div><div class="status">Sin azúcares añadidos en las recetas no significa eliminar fruta o lácteos naturales. Por colesterol y triglicéridos elevados, priorizar fibra y grasas insaturadas; actualizar análisis médicos.</div>`;$('saveFood').onclick=()=>{if(!$('mealDesc').value.trim())return notify('Describe la comida.');saveRecord({type:'food',date:$('foodDate').value||today(),meal:$('meal').value,description:$('mealDesc').value.trim(),calories:Number($('mealCalories').value)||null})}}
function legacyRenderRecipes(){let r=recipes[selectedRecipe],total=r.base.map(i=>i[1]+i[2]);$('recipes').innerHTML=`<h2>Recetas para los dos</h2><p class="muted">Una sola preparación; dos porciones distintas. Cantidades orientativas para los perfiles iniciales de 110 kg y 75 kg; ajustables al evolucionar.</p><label>Elegir receta<select id="recipeSelect">${recipes.map((r,i)=>`<option value="${i}" ${selectedRecipe===i?'selected':''}>${esc(r.name)}</option>`).join('')}</select></label><div class="card"><span class="pill">${esc(r.category)}</span><h3>${esc(r.name)}</h3><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr><th align="left">Ingrediente</th><th>Tú</th><th>Ella</th><th>Total</th></tr></thead><tbody>${r.base.map(i=>`<tr style="border-top:1px solid #e8eeea"><td style="padding:10px 3px">${esc(i[0])}</td><td align="center">${fmt(i[1])}</td><td align="center">${fmt(i[2])}</td><td align="center"><b>${fmt(i[1]+i[2])}</b> ${esc(i[3])}</td></tr>`).join('')}</tbody></table></div><p class="note">Las cantidades indican el estado del alimento (crudo o cocido) cuando corresponde. Ajusta las porciones según objetivos individuales y seguimiento.</p><h3>Preparación paso a paso</h3><ol class="steps">${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><button id="copyRecipe" class="btn alt">Copiar lista de ingredientes</button></div>`;$('recipeSelect').onchange=e=>{selectedRecipe=Number(e.target.value);renderRecipes()};$('copyRecipe').onclick=()=>navigator.clipboard?.writeText(r.name+'\n'+r.base.map(i=>`${i[0]}: ${i[1]+i[2]} ${i[3]}`).join('\n')).then(()=>notify('Ingredientes copiados')).catch(()=>notify('No se pudo copiar en este navegador.'))}
function renderMeasurements(){$('measurements').innerHTML=`<h2>Medidas</h2><p class="muted">Aquí actualizas tus datos. No aparecen formularios de medidas en Inicio.</p><div class="card"><label>Fecha<input id="measureDate" type="date" value="${today()}"></label><label>Peso (kg)<input id="measureWeight" type="number" min="25" max="400" step="0.1" placeholder="Ej.: 109.4"></label><label>Cintura (cm)<input id="measureWaist" type="number" min="30" max="250" step="0.1" placeholder="Ej.: 108"></label><button id="saveMeasure" class="btn">Guardar medidas</button></div><div class="card"><h3>Últimas mediciones</h3>${records.filter(r=>r.type==='measure').slice(0,10).map(r=>`<div class="listitem"><strong>${esc(r.date)}</strong> · ${fmt(r.weight)} kg ${r.waist?'· cintura '+fmt(r.waist)+' cm':''}</div>`).join('')||'<p class="muted">Aún no hay registros.</p>'}</div>`;$('saveMeasure').onclick=()=>{let weight=Number($('measureWeight').value),waist=Number($('measureWaist').value)||null;if(!weight||weight<25||weight>400)return notify('Ingresa un peso válido.');saveRecord({type:'measure',date:$('measureDate').value||today(),weight,waist})}}
function renderHistory(){$('history').innerHTML=`<h2>Historial</h2><p class="muted">Tus registros son privados y están asociados a tu cuenta.</p><div class="card"><label>Fecha<input id="dailyDate" type="date" value="${today()}"></label><div class="grid"><label>Pasos<input id="steps" type="number" min="0" placeholder="5000"></label><label>Agua (vasos)<input id="water" type="number" min="0" placeholder="8"></label><label>Sueño (horas)<input id="sleep" type="number" min="0" max="24" step="0.5" placeholder="7"></label></div><button id="saveDaily" class="btn">Guardar hábitos</button></div><div class="card"><h3>Registros recientes</h3>${records.slice(0,35).map(r=>`<div class="listitem"><div class="row"><strong>${esc(r.date||'Sin fecha')}</strong><span class="badge">${{measure:'Medidas',workout:'Entrenamiento',food:'Comida',daily:'Hábitos'}[r.type]||'Registro'}</span></div><div class="muted">${r.type==='measure'?`${fmt(r.weight)} kg · cintura ${r.waist?fmt(r.waist)+' cm':'sin registrar'}`:r.type==='workout'?`Rutina ${esc(r.routine)} · ${r.exercises?.length||0} ejercicios`:r.type==='food'?`${esc(r.meal)}: ${esc(r.description)}`:r.type==='daily'?`${fmt(r.steps)} pasos · ${fmt(r.water)} vasos de agua · ${fmt(r.sleep)} h de sueño`:''}</div></div>`).join('')||'<p class="muted">Todavía no tienes registros.</p>'}</div>`;$('saveDaily').onclick=()=>saveRecord({type:'daily',date:$('dailyDate').value||today(),steps:Number($('steps').value)||0,water:Number($('water').value)||0,sleep:Number($('sleep').value)||0})}
function legacyRenderSettings(){$('settings').innerHTML=`<h2>Mi perfil y objetivos</h2><div class="card"><p class="muted">Sesión: ${esc(user.email)}</p><label>Nombre<input id="setName" value="${esc(profile.name||'')}"></label><label>Edad<input id="setAge" type="number" min="18" value="${esc(profile.age||'')}"></label><label>Estatura (cm)<input id="setHeight" type="number" min="100" value="${esc(profile.height||'')}"></label><label>Peso inicial (kg)<input id="setWeight" type="number" min="25" step="0.1" value="${esc(profile.weight||'')}"></label><label>Meta de peso (kg)<input id="setGoal" type="number" min="25" step="0.1" value="${esc(profile.goal||((profile.weight||0)*.95)||'')}"></label><label>Sexo para cálculo<select id="setSex"><option value="male" ${profile.sex==='male'?'selected':''}>Hombre</option><option value="female" ${profile.sex==='female'?'selected':''}>Mujer</option></select></label><label>Actividad<select id="setActivity"><option value="low" ${(!profile.activity||profile.activity==='low')?'selected':''}>Sedentaria / 3.000–5.000 pasos</option><option value="light" ${profile.activity==='light'?'selected':''}>Ligera / 5.000–8.000 pasos</option><option value="moderate" ${profile.activity==='moderate'?'selected':''}>Moderada / más de 8.000 pasos</option></select></label><label>Objetivo<select id="setObjective"><option value="fatloss" ${profile.objective!=='maintain'?'selected':''}>Perder grasa</option><option value="maintain" ${profile.objective==='maintain'?'selected':''}>Mantener peso</option></select></label><button id="recalc" class="btn alt" type="button">Calcular mis objetivos automáticamente</button><p class="note">Las calorías y proteínas son estimaciones iniciales, no una prescripción médica.</p><label>Calorías orientativas diarias<input id="setCalories" type="number" min="1200" value="${esc(profile.calories||2100)}"></label><label>Proteína objetivo (g)<input id="setProtein" type="number" min="50" value="${esc(profile.protein||170)}"></label><button id="saveSettings" class="btn">Guardar cambios</button></div><div class="card"><h3>Respaldo de tus datos</h3><p class="muted">Descarga un archivo JSON con tu perfil y registros para conservar una copia independiente.</p><button id="export" class="btn alt">Descargar respaldo</button></div><div class="status">El alojamiento es gratuito dentro de los límites de los proveedores; no hay garantía de que los planes externos sean gratuitos para siempre. No actives facturación.</div>`;$('recalc').onclick=()=>{try{let t=calculateTargets({age:$('setAge').value,weight:$('setWeight').value,height:$('setHeight').value,sex:$('setSex').value,activity:$('setActivity').value,objective:$('setObjective').value});$('setCalories').value=t.calories;$('setProtein').value=t.protein;notify('Objetivos recalculados. Presiona Guardar cambios para conservarlos.')}catch(e){notify(e.message)}};$('saveSettings').onclick=async()=>{let data={...profile,name:$('setName').value.trim(),age:Number($('setAge').value)||null,height:Number($('setHeight').value)||null,weight:Number($('setWeight').value)||null,goal:Number($('setGoal').value)||null,sex:$('setSex').value,activity:$('setActivity').value,objective:$('setObjective').value,calories:Number($('setCalories').value)||2100,protein:Number($('setProtein').value)||170};try{await setDoc(uidPath(),data);profile=data;render();notify('Perfil actualizado')}catch(e){notify(e.message)}};$('export').onclick=()=>{let blob=new Blob([JSON.stringify({profile,records},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='nuestro-plan-respaldo-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}}

const categories=['Desayuno','Almuerzo','Merienda','Cena'];let categorySelected='Desayuno',recipeSelected=0,weeklyPlan=null;
const nKeys=['kcal','proteína','carbohidratos','grasas','fibra'];
function macros(recipe,ratio=1){let totals=[0,0,0,0,0];for(const [name,qty] of recipe.ingredients){let v=nutrition[name];if(!v)continue;for(let i=0;i<5;i++)totals[i]+=v[i]*qty*ratio/100}return totals.map(x=>Math.round(x*10)/10)}
function portions(recipe){let kcal=Number(profile.calories)||2100;let ratios={Desayuno:.25,Almuerzo:.35,Merienda:.13,Cena:.27};let base=macros(recipe)[0];return Math.max(.55,Math.min(2.8,kcal*ratios[recipe.category]/Math.max(1,base)))}
function exclusions(){return [...new Set([...(profile.disliked||[]),...(profile.allergies||[]),...(profile.intolerances||[])].map(x=>x.trim().toLowerCase()).filter(Boolean))]}
function allowed(recipe){let terms=exclusions();return !recipe.ingredients.some(([food])=>terms.some(t=>food.toLowerCase().includes(t)||t.includes(food.toLowerCase())))}
function nutritionHtml(vals){return `<div class="macrogrid">${vals.map((v,i)=>`<div class="macro"><strong>${fmt(v)}${i?' g':''}</strong><small>${nKeys[i]}</small></div>`).join('')}</div>`}
function recipeCard(recipe,ratio=1){
 let m=macros(recipe,ratio);
 let rows=recipe.ingredients.map(([food,qty])=>{let grams=Math.round(qty*ratio),v=nutrition[food];if(!v)return `<tr><td>${esc(food)}</td><td>${grams} g</td><td colspan="5">Sin datos: verificar</td></tr>`;let a=v.map(n=>n*qty*ratio/100);return `<tr><td>${esc(food)}</td><td>${grams} g</td>${a.map(n=>`<td>${fmt(Math.round(n*10)/10)}</td>`).join('')}</tr>`}).join('');
 let macroEnergy=m[1]*4+m[2]*4+m[3]*9;
 let discrepancy=Math.abs(m[0]-macroEnergy)/Math.max(1,m[0]);
 return `<div class="card"><span class="pill">${recipe.category}</span><h3>${esc(recipe.name)}</h3><p class="note">Porción calculada a partir de tus objetivos. Pesos en crudo, salvo alimentos marcados «cocido», conservas escurridas y productos listos para consumir. No se incluyen aceite, salsas o condimentos adicionales si no figuran en ingredientes.</p>${nutritionHtml(m)}<h3>Desglose por ingrediente</h3><div style="overflow-x:auto"><table class="nutrition-table"><thead><tr><th>Ingrediente</th><th>Cantidad</th><th>kcal</th><th>Prot. g</th><th>Carb. g</th><th>Grasa g</th><th>Fibra g</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><th>Total</th><th>1 porción</th>${m.map(v=>`<th>${fmt(v)}</th>`).join('')}</tr></tfoot></table></div><p class="note">Control de consistencia: energía declarada ${fmt(m[0])} kcal; energía estimada a partir de macronutrientes ${fmt(Math.round(macroEnergy))} kcal. ${discrepancy>.12?'⚠️ Diferencia significativa: verificar ficha nutricional y fibra antes de usar esta receta como referencia.':'La diferencia puede deberse a fibra y redondeos.'}</p><h3>Preparación</h3><ol class="steps">${instructions(recipe).map(x=>`<li>${esc(x)}</li>`).join('')}</ol><p class="note"><b>Transparencia nutricional:</b> datos genéricos de composición por 100 g del catálogo interno, no vinculados todavía a identificadores específicos de FoodData Central. No están certificados individualmente; verifica marcas, estado de cocción y alergias. Para una prescripción clínica se requiere valoración profesional.</p></div>`
}
function instructions(r){let names=r.ingredients.map(x=>x[0]);let animal=names.filter(x=>['Pollo','Pavo natural','Carne magra','Cerdo magro','Atún al agua','Huevo','Claras'].includes(x));let cooked=names.filter(x=>/cocid/.test(x));let vegetables=names.filter(x=>['Espinaca','Tomate','Pepino','Brócoli','Zucchini','Pimiento','Champiñones','Lechuga','Zanahoria','Coliflor','Berenjena'].includes(x));return ['Lava los vegetales y pesa todos los ingredientes de la lista antes de cocinar.',animal.length?'Cocina '+animal.join(', ').toLowerCase()+' con condimentos sin azúcar añadida; pollo y pavo deben alcanzar 74 °C en el centro.':'Prepara los ingredientes frescos y mezcla según la textura deseada.',cooked.length?'Usa '+cooked.join(', ').toLowerCase()+' ya cocidos, escurridos y sin exceso de sal.':vegetables.length?'Pica y combina los vegetales; cocina al vapor o saltea los que lo requieran.':'Mezcla o sirve los ingredientes en un recipiente limpio.','Sirve las cantidades calculadas para tu porción; agrega el aceite y el aguacate medidos al final si aparecen.']}
function renderRecipes(){let options=catalog.filter(r=>r.category===categorySelected&&allowed(r));if(recipeSelected>=options.length)recipeSelected=0;let chosen=options[recipeSelected];$('recipes').innerHTML=`<h2>Recetas personalizadas</h2><p class="muted">80 propuestas de la biblioteca (20 por categoría), pendientes de revisión nutricional individual. Se excluyen automáticamente los ingredientes que hayas marcado en Ajustes.</p><div class="tabs">${categories.map(c=>`<button data-cat="${c}" class="${c===categorySelected?'active':''}">${c}</button>`).join('')}</div><div class="card"><h3>${options.length} opciones compatibles de ${categorySelected.toLowerCase()}</h3>${options.length?`<label>Selecciona una receta<select id="chooseRecipe">${options.map((r,i)=>`<option value="${i}" ${recipeSelected===i?'selected':''}>${esc(r.name)}</option>`).join('')}</select></label>`:'<p>No hay recetas compatibles con todas tus exclusiones. Revisa tus preferencias o añade nuevas recetas.</p>'}</div>${chosen?recipeCard(chosen,portions(chosen)):''}<p class="note">Se priorizan ingredientes poco procesados y sin azúcar añadida; la calidad nutricional debe revisarse receta por receta. No son recetas oficiales ni avaladas por Nutrillermo.</p>`;document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{categorySelected=b.dataset.cat;recipeSelected=0;renderRecipes()});if($('chooseRecipe'))$('chooseRecipe').onchange=e=>{recipeSelected=+e.target.value;renderRecipes()}}
function generateWeek(){let buckets=categories.map(cat=>catalog.filter(r=>r.category===cat&&allowed(r)));if(buckets.some(x=>!x.length)){notify('No hay opciones compatibles para una de las comidas. Revisa tus exclusiones en Ajustes.');return}let offset=Math.floor(Math.random()*100000);weeklyPlan=Array.from({length:7},(_,d)=>buckets.map((list,j)=>list[(d*3+j+offset)%list.length]));renderFood()}
function shoppingList(){let totals={};for(let day of weeklyPlan||[])for(let r of day){let factor=portions(r);for(let [food,qty] of r.ingredients)totals[food]=(totals[food]||0)+qty*factor}return Object.entries(totals).sort((a,b)=>a[0].localeCompare(b[0],'es'))}
function renderFood(){let cal=Number(profile.calories)||2100,prot=Number(profile.protein)||170;let pct=[.25,.35,.13,.27];$('food').innerHTML=`<h2>Mi alimentación</h2><p class="muted">Objetivos estimados y menú semanal adaptado a tus preferencias.</p><div class="card"><h3>Objetivo diario</h3>${nutritionHtml([cal,prot,Math.round(cal*.4/4),Math.round(cal*.3/9),Math.round(cal/1000*14)])}<p class="note">Carbohidratos y grasas son una distribución orientativa (40 % y 30 % de energía); proteína es el objetivo individual. No representan una prescripción.</p></div><div class="card"><h3>Distribución por comida</h3>${categories.map((c,i)=>`<div class="listitem row"><span><b>${c}</b><br><small>${Math.round(pct[i]*100)} % del día</small></span><b>${Math.round(cal*pct[i])} kcal · ${Math.round(prot*pct[i])} g proteína</b></div>`).join('')}<p class="note">Son metas aproximadas, no el contenido exacto de una receta. Abre Recetas para ver cantidades y macronutrientes calculados por ingrediente.</p></div><div class="card"><h3>Generador de menú semanal</h3><p>Filtra automáticamente las 80 propuestas con tus alimentos excluidos y organiza 7 días sin repetir la misma receta en días consecutivos.</p><div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn" id="makeWeek">Generar mi semana</button><button class="btn alt" id="refreshWeek">↻ Cambiar menú</button></div>${weeklyPlan?`<div class="week">${weeklyPlan.map((day,i)=>`<div class="listitem"><strong>Día ${i+1}</strong>${day.map(r=>`<div class="row" style="padding:4px 0"><small>${r.category}</small><span style="text-align:right">${esc(r.name)} · ${Math.round(macros(r,portions(r))[0])} kcal</span></div>`).join('')}</div>`).join('')}</div><h3>Lista de compras para una persona · 7 días</h3><div class="ingredients">${shoppingList().map(([food,g])=>`<div class="row"><span>${esc(food)}</span><b>${Math.round(g)} g</b></div>`).join('')}</div><button id="copyShop" class="btn alt">Copiar compras</button><p class="note">La lista corresponde solo a esta cuenta. Para sumar automáticamente las compras de dos personas hará falta vincular ambas cuentas de manera segura; no se accede a la cuenta de tu pareja sin su autorización.</p>`:''}</div><div class="card"><h3>Guía de alimentos</h3><p><b>Priorizar:</b> proteínas magras, verduras variadas, legumbres, frutas enteras, cereales integrales en porciones adecuadas, aceite de oliva y aguacate.</p><p><b>Moderar según el contexto:</b> arroz, pan, avena, papa y otros alimentos ricos en almidón. No son universalmente prohibidos.</p><p><b>Limitar:</b> bebidas azucaradas, dulces, harinas refinadas frecuentes, ultraprocesados y exceso de grasas saturadas.</p><p class="note">La saciedad y la respuesta glucémica varían entre personas. Esta guía no es una lista oficial de Nutrillermo. Con colesterol o triglicéridos elevados conviene seguimiento profesional.</p></div><div class="card"><h3>Registrar comida</h3><label>Fecha<input id="foodDate" type="date" value="${today()}"></label><label>Tipo<select id="meal">${categories.map(c=>`<option>${c}</option>`).join('')}</select></label><label>Qué comiste<input id="mealDesc" placeholder="Ej.: pollo, lentejas y ensalada"></label><label>Calorías aproximadas (opcional)<input id="mealCalories" type="number" min="0"></label><button class="btn" id="saveFood">Guardar comida</button></div>`;$('makeWeek').onclick=generateWeek;$('refreshWeek').onclick=generateWeek;$('saveFood').onclick=()=>{if(!$('mealDesc').value.trim())return notify('Describe la comida.');saveRecord({type:'food',date:$('foodDate').value||today(),meal:$('meal').value,description:$('mealDesc').value.trim(),calories:Number($('mealCalories').value)||null})};if($('copyShop'))$('copyShop').onclick=()=>navigator.clipboard.writeText(shoppingList().map(([k,v])=>`${k}: ${Math.round(v)} g`).join('\n')).then(()=>notify('Lista copiada')).catch(()=>notify('No se pudo copiar'))}
const previousRenderSettings=legacyRenderSettings;
function renderSettings(){previousRenderSettings();let anchor=$('settings').querySelector('.card');let panel=document.createElement('div');panel.className='card';panel.innerHTML=`<h3>Mis preferencias alimentarias</h3><p class="muted">Cada cuenta tiene sus propias exclusiones. Las recetas y el menú se filtran automáticamente.</p><label>Alimentos que no me gustan (separados por comas)<textarea id="disliked" rows="3" placeholder="Ej.: pescado, champiñones">${esc((profile.disliked||[]).join(', '))}</textarea></label><label>Alergias alimentarias (separadas por comas)<textarea id="allergies" rows="2" placeholder="Ej.: huevo">${esc((profile.allergies||[]).join(', '))}</textarea></label><label>Intolerancias (separadas por comas)<textarea id="intolerances" rows="2" placeholder="Ej.: leche">${esc((profile.intolerances||[]).join(', '))}</textarea></label><p class="note">Importante: el filtro usa coincidencias de ingredientes, no garantiza ausencia de trazas ni contaminación cruzada. Si tienes alergias graves, verifica etiquetas y preparación.</p><button class="btn" id="savePrefs">Guardar mis preferencias</button>`;anchor.after(panel);$('savePrefs').onclick=async()=>{let split=id=>$(id).value.split(',').map(x=>x.trim()).filter(Boolean);let updated={...profile,disliked:split('disliked'),allergies:split('allergies'),intolerances:split('intolerances')};try{await setDoc(uidPath(),updated);profile=updated;weeklyPlan=null;recipeSelected=0;render();notify('Preferencias guardadas. Recetas y menú actualizados.')}catch(e){notify('No se pudo guardar: '+e.message)}}}
