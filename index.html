</style></head><body><div id="auth" class="wrap auth"><h1>🌿 Nuestro Plan</h1><p class="muted">Entrenen juntos. Progresen a su ritmo.</p><div class="card"><h2 id="authTitle">Iniciar sesión</h2><label>Correo electrónico<input id="email" type="email" autocomplete="email" placeholder="correo@ejemplo.com"></label><label>Contraseña<input id="password" type="password" autocomplete="current-password" placeholder="Mínimo 6 caracteres"></label><div id="registerFields" class="hidden"><label>Nombre<input id="displayName" placeholder="¿Cómo quieres que te llamemos?"></label><label>Edad<input id="age" type="number" min="18" max="100"></label><label>Peso actual (kg)<input id="startWeight" type="number" min="25" max="400" step="0.1"></label><label>Estatura (cm)<input id="height" type="number" min="100" max="240"></label><label>Sexo para cálculo metabólico<select id="sex"><option value="male">Hombre</option><option value="female">Mujer</option></select></label><label>Actividad habitual<select id="activity"><option value="low">Trabajo sedentario / 3.000–5.000 pasos</option><option value="light">Actividad ligera / 5.000–8.000 pasos</option><option value="moderate">Actividad moderada / más de 8.000 pasos</option></select></label><label>Objetivo<select id="objective"><option value="fatloss">Perder grasa y conservar músculo</option><option value="maintain">Mantener peso</option></select></label><p class="note">Calcularemos automáticamente tus calorías y proteína. Son estimaciones iniciales que podrás ajustar en Ajustes.</p></div><button id="authSubmit" class="btn" style="width:100%">Entrar</button><button id="authSwitch" class="btn alt" style="width:100%;margin-top:10px">Crear cuenta nueva</button><p id="authError" class="error"></p></div><p class="note">Tus datos se almacenan en Firebase en tu cuenta individual. No compartas tu contraseña.</p></div>
<div id="app" class="hidden"><header><div class="top"><div><div style="font-size:13px;opacity:.75">NUESTRO PLAN</div><h1 id="greeting">¡Hola!</h1></div><button id="logout" class="btn alt">Salir</button></div></header><main class="wrap"><section id="home"></section><section id="workouts" class="hidden"></section><section id="food" class="hidden"></section><section id="recipes" class="hidden"></section><section id="measurements" class="hidden"></section><section id="history" class="hidden"></section><section id="settings" class="hidden"></section></main><nav id="nav"><button data-page="home" class="active"><span>⌂</span>Inicio</button><button data-page="workouts"><span>🏋️</span>Rutinas</button><button data-page="food"><span>🥗</span>Comidas</button><button data-page="recipes"><span>🍳</span>Recetas</button><button data-page="measurements"><span>📏</span>Medidas</button><button data-page="history"><span>📈</span>Historial</button><button data-page="settings"><span>⚙️</span>Ajustes</button></nav></div>
<script type="module">

const firebaseConfig={apiKey:'AIzaSyBU9YL8bmcdfs9fvGmPTJM24bk1MaPP890',authDomain:'nuestro-plan-cbb7c.firebaseapp.com',projectId:'nuestro-plan-cbb7c',storageBucket:'nuestro-plan-cbb7c.firebasestorage.app',messagingSenderId:'1075718938723',appId:'1:1075718938723:web:2305b26b6a8bb7786a1856'};
function calculateTargets({age,weight,height,sex='male',activity='low',objective='fatloss'}){
  age=Number(age);weight=Number(weight);height=Number(height);
  if(!(age>=18&&age<=100&&weight>=25&&weight<=400&&height>=100&&height<=240))throw Error('Ingresa edad, peso y estatura válidos para calcular tus objetivos.');
  // Mifflin-St Jeor; activity reflects usual steps and intended gym training.
  const bmr=10*weight+6.25*height-5*age+(sex==='female'?-161:5);
  const multiplier={low:1.30,light:1.42,moderate:1.55}[activity]||1.30;
  const minimum=sex==='female'?1200:1500;
  const calories=Math.round(Math.max(minimum,bmr*multiplier*(objective==='fatloss'?0.80:1))/50)*50;
  const targetWeight=objective==='fatloss'?weight*.95:weight;
  const protein=Math.round(targetWeight*1.65/5)*5;
  return {calories,protein};
}
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);let user=null,profile={},records=[],register=false,selectedRoutine='A',selectedRecipe=0,selectedPage='home';
const workouts={A:[['Prensa de piernas','2–3','10–12','leg press machine exercise technique'],['Press de pecho en máquina','2–3','10–12','machine chest press proper form'],['Jalón al pecho','2–3','10–12','lat pulldown proper form'],['Curl femoral sentado','2','12–15','seated leg curl proper form'],['Elevaciones laterales','2','12–15','dumbbell lateral raise proper form'],['Plancha abdominal','2','20–30 s','forearm plank exercise form']],B:[['Sentadilla goblet','2–3','10–12','goblet squat proper form'],['Remo sentado en polea','2–3','10–12','seated cable row proper form'],['Press de hombros en máquina','2','10–12','shoulder press machine proper form'],['Peso muerto rumano con mancuernas','2','10–12','dumbbell romanian deadlift proper form'],['Curl de bíceps','2','12','dumbbell biceps curl proper form'],['Extensión de tríceps en polea','2','12','cable triceps pushdown proper form']]};
// All quantities are raw unless specified; macros are illustrative, not calculated clinical prescriptions.
const recipes=[
{name:'Pollo al limón con arroz integral y vegetales',category:'Almuerzo / cena',base:[['Pechuga de pollo cruda',200,150,'g'],['Arroz integral cocido',100,70,'g'],['Brócoli',150,120,'g'],['Aceite de oliva',8,6,'g'],['Limón',20,15,'g']],steps:['Condimenta el pollo con limón, pimienta y ajo.','Cocina el pollo a la plancha hasta que esté completamente cocido (74 °C en el centro).','Cocina el arroz integral por separado.','Cuece el brócoli al vapor y añade el aceite medido al servir.','Reparte las porciones con ayuda de una balanza.']},
{name:'Bowl de pollo, fréjol y aguacate',category:'Almuerzo / cena',base:[['Pechuga de pollo cruda',190,140,'g'],['Fréjol cocido',130,100,'g'],['Aguacate',65,45,'g'],['Tomate',120,100,'g'],['Lechuga',100,100,'g'],['Aceite de oliva',5,4,'g']],steps:['Cocina el fréjol sin exceso de sal ni embutidos.','Sazona y cocina el pollo hasta que esté bien hecho.','Lava y corta tomate y lechuga.','Sirve el fréjol y el pollo según la porción de cada uno.','Añade aguacate y aceite medidos al final.']},
{name:'Tortilla de huevo y vegetales con tostada integral',category:'Desayuno',base:[['Huevos enteros',2,1,'unidad'],['Claras de huevo',150,150,'g'],['Espinaca',80,70,'g'],['Tomate',100,90,'g'],['Pan 100 % integral',60,40,'g'],['Aceite de oliva',5,5,'g']],steps:['Lava y pica los vegetales.','Bate huevos y claras; agrega los vegetales.','Cocina a fuego medio con el aceite medido hasta que cuaje por completo.','Acompaña con la tostada integral correspondiente.']},
{name:'Pescado al horno con camote y ensalada',category:'Almuerzo / cena',base:[['Filete de pescado crudo',220,160,'g'],['Camote',150,110,'g'],['Pepino',120,100,'g'],['Tomate',120,100,'g'],['Aceite de oliva',10,7,'g']],steps:['Precalienta el horno a 190 °C.','Corta el camote y hornéalo hasta que esté tierno.','Condimenta el pescado con limón y especias.','Hornea el pescado hasta que esté cocido y se desmenuce fácilmente (63 °C).','Sirve con ensalada fresca y aceite medido.']},
{name:'Yogur natural alto en proteína con avena y fresas',category:'Desayuno / merienda',base:[['Yogur natural alto en proteína sin azúcar',250,200,'g'],['Avena en hojuelas',35,25,'g'],['Fresas',120,100,'g'],['Chía',12,10,'g']],steps:['Coloca el yogur sin azúcar en un recipiente.','Agrega avena, chía y fresas lavadas.','Mezcla y deja reposar unos minutos para suavizar la avena.','No agregues azúcar, miel ni jarabes.']},
{name:'Salteado de carne magra con vegetales',category:'Almuerzo / cena',base:[['Carne de res magra cruda',190,140,'g'],['Zucchini',180,150,'g'],['Pimiento',100,80,'g'],['Champiñones',120,100,'g'],['Aceite de oliva',9,7,'g'],['Lentejas cocidas',120,90,'g']],steps:['Corta la carne magra en tiras y los vegetales en trozos.','Saltea la carne en sartén caliente con parte del aceite.','Agrega vegetales y cocina hasta que estén tiernos.','Sirve con lentejas cocidas y reparte el aceite total medido.']}
];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(n){return Number(n).toLocaleString('es-EC',{maximumFractionDigits:1})}function today(){return new Date().toLocaleDateString('en-CA')};function uidPath(){return doc(db,'users',user.uid)}function recordCollection(){return collection(db,'users',user.uid,'records')}function notify(msg,ok=true){alert(msg)}
$('authSwitch').onclick=()=>{register=!register;$('registerFields').classList.toggle('hidden',!register);$('authTitle').textContent=register?'Crear mi cuenta':'Iniciar sesión';$('authSubmit').textContent=register?'Registrarme':'Entrar';$('authSwitch').textContent=register?'Ya tengo cuenta':'Crear cuenta nueva';$('authError').textContent=''};
$('authSubmit').onclick=async()=>{let email=$('email').value.trim(),password=$('password').value;$('authError').textContent='';$('authSubmit').disabled=true;try{if(register){if(!$('displayName').value.trim())throw Error('Escribe tu nombre.');let fields={age:Number($('age').value),weight:Number($('startWeight').value),height:Number($('height').value),sex:$('sex').value,activity:$('activity').value,objective:$('objective').value};let targets=calculateTargets(fields);let cred=await createUserWithEmailAndPassword(auth,email,password);let p={name:$('displayName').value.trim(),...fields,...targets,createdAt:new Date().toISOString()};await setDoc(doc(db,'users',cred.user.uid),p);await updateProfile(cred.user,{displayName:p.name});profile=p;await load();}else await signInWithEmailAndPassword(auth,email,password)}catch(e){$('authError').textContent=e.code==='auth/invalid-credential'?'Correo o contraseña incorrectos.':e.message}finally{$('authSubmit').disabled=false}};
$('logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{user=u;if(!u){$('app').classList.add('hidden');$('auth').classList.remove('hidden');return}$('auth').classList.add('hidden');$('app').classList.remove('hidden');await load()});
async function load(){if(!user)return;try{let snap=await getDoc(uidPath());profile=snap.exists()?snap.data():{name:user.displayName||user.email.split('@')[0],calories:2100,protein:170};let q=await getDocs(recordCollection());records=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(b.date).localeCompare(String(a.date)));render()}catch(e){notify('Error al cargar datos: '+e.message)}}
async function saveRecord(data){try{await addDoc(recordCollection(),{...data,createdAt:serverTimestamp()});await load();notify('Registro guardado correctamente')}catch(e){notify('No se pudo guardar: '+e.message)}}
function show(page){selectedPage=page;document.querySelectorAll('main section').forEach(s=>s.classList.toggle('hidden',s.id!==page));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));render();window.scrollTo(0,0)}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.page));
function render(){if(!user)return;$('greeting').textContent='Hola, '+(profile.name||'bienvenido')+' 👋';renderHome();renderWorkout();renderFood();renderRecipes();renderMeasurements();renderHistory();renderSettings()}
function latest(type){return records.filter(r=>r.type===type)[0]};
function renderHome(){let w=latest('measure'),current=w?.weight||profile.weight||'—',goal=profile.goal||((profile.weight||0)*.95)||'—';$('home').innerHTML=`<h2>Tu resumen</h2><p class="muted">Un plan compartido; avances individuales.</p><div class="grid"><div class="card"><div class="muted">Último peso</div><div class="big">${esc(current)} kg</div></div><div class="card"><div class="muted">Meta inicial</div><div class="big">${typeof goal==='number'?fmt(goal):goal} kg</div></div><div class="card"><div class="muted">Calorías orientativas</div><div class="big">${fmt(profile.calories||2100)}</div></div><div class="card"><div class="muted">Proteína objetivo</div><div class="big">${fmt(profile.protein||170)} g</div></div></div><div class="card"><h3>Esta semana</h3><p>🏋️ Lunes: Rutina A · Miércoles: Rutina B · Viernes: Rutina A</p><p>🚶 Martes y jueves: caminata 25–35 min</p><p class="note">La semana siguiente alterna B–A–B. La primera semana comienza con 2 series por ejercicio y cargas ligeras.</p></div><div class="card"><h3>Tu enfoque de alimentación</h3><p>Recetas compartidas sin azúcar añadida, menos harinas refinadas, proteínas suficientes, vegetales y grasas principalmente insaturadas.</p><p class="note">Los objetivos energéticos son estimaciones ajustables, no prescripciones médicas.</p></div>`}
function renderWorkout(){$('workouts').innerHTML=`<h2>Rutinas compartidas</h2><p class="muted">Mismos ejercicios para ambos, cargas individuales. Videos externos de demostración.</p><div class="tabs"><button id="ra" class="${selectedRoutine==='A'?'active':''}">Rutina A</button><button id="rb" class="${selectedRoutine==='B'?'active':''}">Rutina B</button></div><div class="card"><p class="note">Calienta 5–10 min; deja 2–4 repeticiones en reserva. Semana 1: solo 2 series por ejercicio. Descansa 60–120 s o más si lo necesitas.</p>${workouts[selectedRoutine].map((e,i)=>`<div class="exercise"><div class="row"><strong>${i+1}. ${esc(e[0])}</strong><span class="pill">${esc(e[1])} × ${esc(e[2])}</span></div><p><a target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(e[3])}">▶ Ver demostraciones del ejercicio</a></p><div class="grid"><label>Peso utilizado (kg)<input id="kg${i}" type="number" min="0" step="0.5" placeholder="0"></label><label>Repeticiones realizadas<input id="reps${i}" type="number" min="0" max="100" placeholder="12"></label></div></div>`).join('')}<label>Fecha<input id="workDate" type="date" value="${today()}"></label><button class="btn" id="saveWorkout">Guardar entrenamiento ${selectedRoutine}</button></div>`;$('ra').onclick=()=>{selectedRoutine='A';renderWorkout()};$('rb').onclick=()=>{selectedRoutine='B';renderWorkout()};$('saveWorkout').onclick=()=>saveRecord({type:'workout',date:$('workDate').value||today(),routine:selectedRoutine,exercises:workouts[selectedRoutine].map((e,i)=>({name:e[0],kg:Number($('kg'+i).value)||0,reps:Number($('reps'+i).value)||0}))})}
function renderFood(){$('food').innerHTML=`<h2>Nutrición</h2><p class="muted">Cocinan lo mismo; cada persona sirve sus porciones.</p><div class="card"><h3>Cómo organizar tu día</h3><div class="listitem"><strong>Desayuno · 07:00–09:00</strong><p>Proteína + vegetales + porción moderada de carbohidrato con fibra.</p></div><div class="listitem"><strong>Almuerzo · 12:30–14:00</strong><p>En el comedor: 1–2 palmas de proteína magra, medio plato de vegetales y porción pequeña de arroz o menestra. Agua en lugar de jugo azucarado.</p></div><div class="listitem"><strong>Merienda · 16:30–17:30</strong><p>Yogur natural alto en proteína y fruta, o sándwich integral pequeño con pollo.</p></div><div class="listitem"><strong>Cena · 20:00–21:00</strong><p>Proteína magra + verduras + carbohidrato de buena calidad según hambre y entrenamiento.</p></div></div><div class="card"><h3>Registrar tu alimentación</h3><label>Fecha<input id="foodDate" type="date" value="${today()}"></label><label>Comida<select id="meal"><option>Desayuno</option><option>Almuerzo</option><option>Merienda</option><option>Cena</option></select></label><label>Qué comiste<input id="mealDesc" placeholder="Ej.: pollo, ensalada, arroz integral"></label><label>Calorías aproximadas (opcional)<input id="mealCalories" type="number" min="0" placeholder="Opcional"></label><button class="btn" id="saveFood">Guardar comida</button></div><div class="status">Sin azúcares añadidos en las recetas no significa eliminar fruta o lácteos naturales. Por colesterol y triglicéridos elevados, priorizar fibra y grasas insaturadas; actualizar análisis médicos.</div>`;$('saveFood').onclick=()=>{if(!$('mealDesc').value.trim())return notify('Describe la comida.');saveRecord({type:'food',date:$('foodDate').value||today(),meal:$('meal').value,description:$('mealDesc').value.trim(),calories:Number($('mealCalories').value)||null})}}
function renderRecipes(){let r=recipes[selectedRecipe],total=r.base.map(i=>i[1]+i[2]);$('recipes').innerHTML=`<h2>Recetas para los dos</h2><p class="muted">Una sola preparación; dos porciones distintas. Cantidades orientativas para los perfiles iniciales de 110 kg y 75 kg; ajustables al evolucionar.</p><label>Elegir receta<select id="recipeSelect">${recipes.map((r,i)=>`<option value="${i}" ${selectedRecipe===i?'selected':''}>${esc(r.name)}</option>`).join('')}</select></label><div class="card"><span class="pill">${esc(r.category)}</span><h3>${esc(r.name)}</h3><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr><th align="left">Ingrediente</th><th>Tú</th><th>Ella</th><th>Total</th></tr></thead><tbody>${r.base.map(i=>`<tr style="border-top:1px solid #e8eeea"><td style="padding:10px 3px">${esc(i[0])}</td><td align="center">${fmt(i[1])}</td><td align="center">${fmt(i[2])}</td><td align="center"><b>${fmt(i[1]+i[2])}</b> ${esc(i[3])}</td></tr>`).join('')}</tbody></table></div><p class="note">Las cantidades indican el estado del alimento (crudo o cocido) cuando corresponde. Ajusta las porciones según objetivos individuales y seguimiento.</p><h3>Preparación paso a paso</h3><ol class="steps">${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><button id="copyRecipe" class="btn alt">Copiar lista de ingredientes</button></div>`;$('recipeSelect').onchange=e=>{selectedRecipe=Number(e.target.value);renderRecipes()};$('copyRecipe').onclick=()=>navigator.clipboard?.writeText(r.name+'\n'+r.base.map(i=>`${i[0]}: ${i[1]+i[2]} ${i[3]}`).join('\n')).then(()=>notify('Ingredientes copiados')).catch(()=>notify('No se pudo copiar en este navegador.'))}
function renderMeasurements(){$('measurements').innerHTML=`<h2>Medidas</h2><p class="muted">Aquí actualizas tus datos. No aparecen formularios de medidas en Inicio.</p><div class="card"><label>Fecha<input id="measureDate" type="date" value="${today()}"></label><label>Peso (kg)<input id="measureWeight" type="number" min="25" max="400" step="0.1" placeholder="Ej.: 109.4"></label><label>Cintura (cm)<input id="measureWaist" type="number" min="30" max="250" step="0.1" placeholder="Ej.: 108"></label><button id="saveMeasure" class="btn">Guardar medidas</button></div><div class="card"><h3>Últimas mediciones</h3>${records.filter(r=>r.type==='measure').slice(0,10).map(r=>`<div class="listitem"><strong>${esc(r.date)}</strong> · ${fmt(r.weight)} kg ${r.waist?'· cintura '+fmt(r.waist)+' cm':''}</div>`).join('')||'<p class="muted">Aún no hay registros.</p>'}</div>`;$('saveMeasure').onclick=()=>{let weight=Number($('measureWeight').value),waist=Number($('measureWaist').value)||null;if(!weight||weight<25||weight>400)return notify('Ingresa un peso válido.');saveRecord({type:'measure',date:$('measureDate').value||today(),weight,waist})}}
function renderHistory(){$('history').innerHTML=`<h2>Historial</h2><p class="muted">Tus registros son privados y están asociados a tu cuenta.</p><div class="card"><label>Fecha<input id="dailyDate" type="date" value="${today()}"></label><div class="grid"><label>Pasos<input id="steps" type="number" min="0" placeholder="5000"></label><label>Agua (vasos)<input id="water" type="number" min="0" placeholder="8"></label><label>Sueño (horas)<input id="sleep" type="number" min="0" max="24" step="0.5" placeholder="7"></label></div><button id="saveDaily" class="btn">Guardar hábitos</button></div><div class="card"><h3>Registros recientes</h3>${records.slice(0,35).map(r=>`<div class="listitem"><div class="row"><strong>${esc(r.date||'Sin fecha')}</strong><span class="badge">${{measure:'Medidas',workout:'Entrenamiento',food:'Comida',daily:'Hábitos'}[r.type]||'Registro'}</span></div><div class="muted">${r.type==='measure'?`${fmt(r.weight)} kg · cintura ${r.waist?fmt(r.waist)+' cm':'sin registrar'}`:r.type==='workout'?`Rutina ${esc(r.routine)} · ${r.exercises?.length||0} ejercicios`:r.type==='food'?`${esc(r.meal)}: ${esc(r.description)}`:r.type==='daily'?`${fmt(r.steps)} pasos · ${fmt(r.water)} vasos de agua · ${fmt(r.sleep)} h de sueño`:''}</div></div>`).join('')||'<p class="muted">Todavía no tienes registros.</p>'}</div>`;$('saveDaily').onclick=()=>saveRecord({type:'daily',date:$('dailyDate').value||today(),steps:Number($('steps').value)||0,water:Number($('water').value)||0,sleep:Number($('sleep').value)||0})}
function renderSettings(){$('settings').innerHTML=`<h2>Mi perfil y objetivos</h2><div class="card"><p class="muted">Sesión: ${esc(user.email)}</p><label>Nombre<input id="setName" value="${esc(profile.name||'')}"></label><label>Edad<input id="setAge" type="number" min="18" value="${esc(profile.age||'')}"></label><label>Estatura (cm)<input id="setHeight" type="number" min="100" value="${esc(profile.height||'')}"></label><label>Peso inicial (kg)<input id="setWeight" type="number" min="25" step="0.1" value="${esc(profile.weight||'')}"></label><label>Meta de peso (kg)<input id="setGoal" type="number" min="25" step="0.1" value="${esc(profile.goal||((profile.weight||0)*.95)||'')}"></label><label>Sexo para cálculo<select id="setSex"><option value="male" ${profile.sex==='male'?'selected':''}>Hombre</option><option value="female" ${profile.sex==='female'?'selected':''}>Mujer</option></select></label><label>Actividad<select id="setActivity"><option value="low" ${(!profile.activity||profile.activity==='low')?'selected':''}>Sedentaria / 3.000–5.000 pasos</option><option value="light" ${profile.activity==='light'?'selected':''}>Ligera / 5.000–8.000 pasos</option><option value="moderate" ${profile.activity==='moderate'?'selected':''}>Moderada / más de 8.000 pasos</option></select></label><label>Objetivo<select id="setObjective"><option value="fatloss" ${profile.objective!=='maintain'?'selected':''}>Perder grasa</option><option value="maintain" ${profile.objective==='maintain'?'selected':''}>Mantener peso</option></select></label><button id="recalc" class="btn alt" type="button">Calcular mis objetivos automáticamente</button><p class="note">Las calorías y proteínas son estimaciones iniciales, no una prescripción médica.</p><label>Calorías orientativas diarias<input id="setCalories" type="number" min="1200" value="${esc(profile.calories||2100)}"></label><label>Proteína objetivo (g)<input id="setProtein" type="number" min="50" value="${esc(profile.protein||170)}"></label><button id="saveSettings" class="btn">Guardar cambios</button></div><div class="card"><h3>Respaldo de tus datos</h3><p class="muted">Descarga un archivo JSON con tu perfil y registros para conservar una copia independiente.</p><button id="export" class="btn alt">Descargar respaldo</button></div><div class="status">El alojamiento es gratuito dentro de los límites de los proveedores; no hay garantía de que los planes externos sean gratuitos para siempre. No actives facturación.</div>`;$('recalc').onclick=()=>{try{let t=calculateTargets({age:$('setAge').value,weight:$('setWeight').value,height:$('setHeight').value,sex:$('setSex').value,activity:$('setActivity').value,objective:$('setObjective').value});$('setCalories').value=t.calories;$('setProtein').value=t.protein;notify('Objetivos recalculados. Presiona Guardar cambios para conservarlos.')}catch(e){notify(e.message)}};$('saveSettings').onclick=async()=>{let data={...profile,name:$('setName').value.trim(),age:Number($('setAge').value)||null,height:Number($('setHeight').value)||null,weight:Number($('setWeight').value)||null,goal:Number($('setGoal').value)||null,sex:$('setSex').value,activity:$('setActivity').value,objective:$('setObjective').value,calories:Number($('setCalories').value)||2100,protein:Number($('setProtein').value)||170};try{await setDoc(uidPath(),data);profile=data;render();notify('Perfil actualizado')}catch(e){notify(e.message)}};$('export').onclick=()=>{let blob=new Blob([JSON.stringify({profile,records},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='nuestro-plan-respaldo-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}}
</script></body></html>
